[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-touchbar"
version = "0"
description = "Native macOS Touch Bar dashboard for coding-agent sessions, quotas, and app focus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ViPro" }]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pyright==1.1.411"]

[project.scripts]
agent-touchbar = "agent_touchbar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
