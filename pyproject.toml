[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbar-touchbar"
version = "0"
description = "Touch Bar controls for CodexBar sessions and usage limits on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ViPro" }]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pyright==1.1.413"]

[project.scripts]
codexbar-touchbar = "codexbar_touchbar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
