name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: pyright src tests
      - run: python -m compileall -q src tests
      - run: swift test --package-path native
      - run: bash -n native/build-app.sh scripts/install.sh scripts/install-renderer.sh scripts/uninstall.sh skills/setup-agent-touchbar/scripts/check.sh
