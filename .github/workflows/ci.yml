name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: pyright src tests
      - run: python -m compileall -q src tests
      - run: bash -n scripts/install.sh scripts/uninstall.sh skills/setup-codexbar-touchbar/scripts/check.sh
